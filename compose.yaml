# Atalaya: the four products running together on one network.
# Expects the product repos checked out next to this one: ../hookrelay ../flagship ../nimbus ../bitacora
name: atalaya

x-secret: &secret
  NIMBUS_WEBHOOK_SECRET: ${NIMBUS_WEBHOOK_SECRET:-atalaya-local-shared-secret}

services:
  # ---------------------------------------------------------------- Hookrelay (event delivery)
  hookrelay-postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: hookrelay, POSTGRES_PASSWORD: hookrelay, POSTGRES_DB: hookrelay }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "hookrelay"], interval: 2s, retries: 30 }
  hookrelay-redis:
    image: redis:8-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }
  hookrelay-api: &hookrelay
    build: { context: ../hookrelay, dockerfile: apps/api/Dockerfile }
    image: atalaya-hookrelay:local
    environment:
      <<: *secret
      DATABASE_URL: postgres://hookrelay:hookrelay@hookrelay-postgres:5432/hookrelay
      REDIS_URL: redis://hookrelay-redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      ALLOW_PRIVATE_TARGETS: "true" # demo: the receiver lives on this Docker network
      RETRY_SCHEDULE: "2,5,15"
      LOG_FORMAT: json
    ports: ["3000:3000"]
    depends_on: { hookrelay-postgres: { condition: service_healthy }, hookrelay-redis: { condition: service_healthy } }
  hookrelay-worker:
    <<: *hookrelay
    build: !reset null
    pull_policy: never
    command: ["node", "dist/worker.js"]
    ports: []
    depends_on: [hookrelay-api]

  # ---------------------------------------------------------------- Flagship (feature management)
  flagship-postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: flagship, POSTGRES_PASSWORD: flagship, POSTGRES_DB: flagship }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "flagship"], interval: 2s, retries: 30 }
  flagship:
    build: ../flagship
    environment:
      <<: *secret
      DATABASE_URL: postgres://flagship:flagship@flagship-postgres:5432/flagship
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      LOG_FORMAT: json
      # Flag changes are published to Hookrelay with the platform tenant's key, written by bootstrap.
      HOOKRELAY_URL: http://hookrelay-api:3000
      HOOKRELAY_API_KEY_FILE: /state/hookrelay-api-key
    volumes: ["platform-state:/state:ro"]
    ports: ["4000:4000"]
    depends_on:
      flagship-postgres: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }

  # ---------------------------------------------------------------- Nimbus (async pipeline guardian)
  nimbus-postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: nimbus, POSTGRES_PASSWORD: nimbus, POSTGRES_DB: nimbus }
    volumes: ["../nimbus/deploy/postgres/init-runtime-roles.sql:/docker-entrypoint-initdb.d/10-runtime-roles.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"], interval: 2s, retries: 30 }
  nimbus-migrate:
    build: ../nimbus
    image: atalaya-nimbus:local
    environment: &nimbus-env
      NIMBUS_ENV: development
      NIMBUS_COMPONENT: migrate
      NIMBUS_DATABASE_URL: postgres://nimbus:nimbus@nimbus-postgres:5432/nimbus?sslmode=disable
      NIMBUS_API_KEY: ${NIMBUS_API_KEY:-nimbus-local-development-key}
      NIMBUS_TENANT_ID: 00000000-0000-0000-0000-000000000001
      NIMBUS_TENANT_NAME: Atalaya Local
    depends_on: { nimbus-postgres: { condition: service_healthy } }
    restart: "no"
  nimbus:
    image: atalaya-nimbus:local
    pull_policy: never
    environment:
      <<: [*nimbus-env, *secret]
      NIMBUS_COMPONENT: all
      NIMBUS_HTTP_ADDRESS: :8080
      NIMBUS_WORKER_COUNT: 2
      # Nimbus blocks private destinations by default; only its two sibling products are allowed.
      NIMBUS_OUTBOUND_ALLOWED_HOSTS: flagship,hookrelay-api
    ports: ["8080:8080"]
    depends_on: { nimbus-migrate: { condition: service_completed_successfully } }

  # ---------------------------------------------------------------- Bitácora (incident ledger)
  # In AWS it runs as Lambda + DynamoDB (../bitacora/infra/terraform); here the same handlers run
  # behind a small HTTP adapter, with DynamoDB Local.
  bitacora-dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    healthcheck: { test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8000 || exit 1"], interval: 2s, retries: 30 }
  bitacora:
    build: ../bitacora
    environment:
      DYNAMODB_ENDPOINT: http://bitacora-dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      BITACORA_TOKEN: ${ADMIN_TOKEN:-change-me}
      PUBLIC_BASE_URL: http://bitacora:8090 # the URL Hookrelay delivers to, inside this network
    ports: ["8090:8090"]
    depends_on: { bitacora-dynamodb: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"], interval: 2s, retries: 30 }

  # ---------------------------------------------------------------- Wiring (one-shot, see bootstrap.mjs)
  bootstrap:
    image: node:24-alpine
    command: ["node", "/bootstrap.mjs"]
    volumes: ["./bootstrap.mjs:/bootstrap.mjs:ro", "platform-state:/state"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      BITACORA_TOKEN: ${ADMIN_TOKEN:-change-me}
    depends_on:
      hookrelay-api: { condition: service_started }
      bitacora: { condition: service_healthy }
    restart: "no"

  # ---------------------------------------------------------------- A customer system receiving webhooks
  receiver:
    image: node:24-alpine
    working_dir: /app
    volumes: ["../hookrelay/examples/receiver:/app:ro"]
    command: ["node", "server.js"]
    environment: { FAIL_RATE: "0" }

volumes:
  platform-state:
